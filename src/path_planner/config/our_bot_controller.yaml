# LIFECYCLE/NAMESPACE: Scoped node name for /our_bot namespace
our_bot/controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    enable_stamped_cmd_vel: true
    costmap_update_timeout: 1.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # ========================================================================
    # REGULATED PURE PURSUIT (RPP) CONTROLLER
    # ========================================================================
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      
      # --- Core Speeds ---
      desired_linear_vel: 0.4          
      min_approach_linear_velocity: 0.05 
      max_angular_accel: 0.7           
      
      # --- The "Carrot" Lookahead ---
      lookahead_dist: 0.6              # <-- TUNED: 0.6m provides a smooth arc without overshooting tight corners.
      min_lookahead_dist: 0.3          # <-- TUNED: Increased from 0.2 to 0.3 to prevent twitching at very low speeds.
      max_lookahead_dist: 0.8          
      lookahead_time: 1.5              # <-- TUNED: Scaled up to 1.5. At 0.4 m/s max speed, this pushes the carrot 0.6m ahead natively.
      use_velocity_scaled_lookahead: true
      max_robot_pose_search_dist: 2.0  
      
      # --- Smart Scaling (Prevents wall rubbing) ---
      use_regulated_linear_velocity_scaling: true      
      regulated_linear_scaling_min_radius: 0.5         
      regulated_linear_scaling_min_speed: 0.25         
      
      use_cost_regulated_linear_velocity_scaling: true 
      cost_scaling_dist: 0.3                           
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      
      # --- Collision & Reversing ---
      use_collision_detection: true    
      max_allowed_time_to_collision_up_to_carrot: 1.0 
      allow_reversing: false           
      
      # --- Rotation Behaviors ---
      use_rotate_to_heading: true      
      rotate_to_heading_min_angle: 0.78 
      rotate_to_heading_angular_vel: 0.8 # <-- TUNED: Bumped from 0.4 to 0.8 so the robot doesn't stall for 3 seconds trying to turn around.
      
      transform_tolerance: 0.3           # <-- TUNED: Bumped from 0.2 to 0.3 to absorb high-frequency TF broadcast delays from your Python node.
      allow_obstacle_checking_beyond_goal: true

      
our_bot/local_costmap/local_costmap:
  ros__parameters:
    use_sim_time: True
    update_frequency: 20.0
    publish_frequency: 20.0
    global_frame: our_bot/odom
    robot_base_frame: our_bot/base_link
    rolling_window: true
    width: 4
    height: 4 
    transform_tolerance: 0.3        # <-- TUNED: Matched to the controller to prevent TF extrapolation jitter.
    resolution: 0.06        
    footprint: "[[ 0.189,  0.000],
          [ 0.134, -0.134],
          [ 0.000, -0.189],
          [-0.134, -0.134],
          [-0.189,  0.000],
          [-0.134,  0.134],
          [ 0.000,  0.189],
          [ 0.134,  0.134]]"
    track_unknown_space: true
    plugins: ["obstacle_layer", "inflation_layer"]

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      cost_scaling_factor: 12.0  
      inflation_radius: 0.40        # <-- TUNED: In your file it had reverted to 0.45. Dropped back to 0.30 to open up gray space in the compact map.

    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"     
      enabled: True
      observation_sources: scan
      scan:
        topic: /our_bot/scan
        sensor_frame: our_bot/base_scan
        max_obstacle_height: 2.0
        clearing: True
        marking: True
        data_type: "LaserScan"
        raytrace_max_range: 3.0
        raytrace_min_range: 0.15
        obstacle_max_range: 2.5
        obstacle_min_range: 0.15
        inf_is_valid: true
    always_send_full_costmap: True