# LIFECYCLE/NAMESPACE: Scoped node name for /our_bot namespace
our_bot/controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    enable_stamped_cmd_vel: true
    costmap_update_timeout: 1.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # ========================================================================
    # REGULATED PURE PURSUIT (RPP) CONTROLLER
    # ========================================================================
      FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      max_linear_vel: 0.5
      min_linear_vel: 0.5
      max_angular_vel: 2.5
      min_angular_vel: -2.5
      max_linear_accel: 2.5
      max_linear_decel: 0.0
      max_angular_accel: 3.2
      max_angular_decel: -3.2
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.8
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 1.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 1.0
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      interpolate_curvature_after_goal: false
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      use_dynamic_window: true
      allow_obstacle_checking_beyond_goal: true


our_bot/local_costmap/local_costmap:
  ros__parameters:
    use_sim_time: True
    update_frequency: 20.0
    publish_frequency: 20.0
    global_frame: our_bot/odom
    robot_base_frame: our_bot/base_link
    rolling_window: true
    width: 4
    height: 4 
    transform_tolerance: 0.3        # <-- TUNED: Matched to the controller to prevent TF extrapolation jitter.
    resolution: 0.06        
    footprint: "[[ 0.189,  0.000],
          [ 0.134, -0.134],
          [ 0.000, -0.189],
          [-0.134, -0.134],
          [-0.189,  0.000],
          [-0.134,  0.134],
          [ 0.000,  0.189],
          [ 0.134,  0.134]]"
    track_unknown_space: true
    plugins: ["obstacle_layer", "inflation_layer"]

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      cost_scaling_factor: 12.0  
      inflation_radius: 0.40        # <-- TUNED: In your file it had reverted to 0.45. Dropped back to 0.30 to open up gray space in the compact map.

    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"     
      enabled: True
      observation_sources: scan
      scan:
        topic: /our_bot/scan
        sensor_frame: our_bot/base_scan
        max_obstacle_height: 2.0
        clearing: True
        marking: True
        data_type: "LaserScan"
        raytrace_max_range: 3.0
        raytrace_min_range: 0.15
        obstacle_max_range: 2.5
        obstacle_min_range: 0.15
        inf_is_valid: true
    always_send_full_costmap: True