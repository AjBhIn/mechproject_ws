# LIFECYCLE/NAMESPACE: Scoped node name for /our_bot namespace
our_bot/controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    enable_stamped_cmd_vel: true
    costmap_update_timeout: 1.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 40
      model_dt: 0.05
      batch_size: 3000
      ax_max: 1.5
      ax_min: -1.5
      ay_max: 0.0
      ay_min: 0.0
      az_max: 3.0
      vx_std: 0.25
      vy_std: 0.0
      wz_std: 0.40          
      vx_max: 0.80          
      vx_min: 0.0           
      vy_max: 0.0
      wz_max: 1.5
      iteration_count: 2
      prune_distance: 1.7
      transform_tolerance: 0.2
      temperature: 0.20     
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      regenerate_noises: true
      consider_footprint: true
      
      critics: [
        "ConstraintCritic",
        "ObstaclesCritic", 
        "CostCritic", 
        "GoalCritic",
        "GoalAngleCritic", 
        "PathAlignCritic", 
        "PathFollowCritic",
        "PathAngleCritic", 
        "PreferForwardCritic",
        "TwirlingCritic"
      ]
        
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 0.5          # <-- RELAXED: Dropped from 1.0 to 0.5. Stops the bot from bowing wildly away from walls.
        critical_weight: 5.0           # <-- RELAXED: Dropped from 6.0 to 5.0. 
        consider_footprint: true
        collision_margin_distance: 0.08 # <-- RELAXED: Dropped from 0.2 to 0.08 (8cm). Allows the bot to squeeze through tight gaps.

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.0        
        threshold_to_consider: 0.25 

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 0.5
        threshold_to_consider: 0.5

      CostCritic:
        enabled: true
        cost_power: 2
        cost_weight: 3.0              # <-- RELAXED
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 10 
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      
      TwirlingCritic:           
        enabled: true
        twirling_cost_power: 1
        twirling_cost_weight: 2.0

our_bot/local_costmap/local_costmap:
  ros__parameters:
    use_sim_time: True
    update_frequency: 20.0
    publish_frequency: 20.0
    global_frame: our_bot/odom
    robot_base_frame: our_bot/base_link
    rolling_window: true
    width: 4
    height: 4 
    transform_tolerance: 0.2
    resolution: 0.06        
    footprint: "[[ 0.189,  0.000],
          [ 0.134, -0.134],
          [ 0.000, -0.189],
          [-0.134, -0.134],
          [-0.189,  0.000],
          [-0.134,  0.134],
          [ 0.000,  0.189],
          [ 0.134,  0.134]]"
    track_unknown_space: true
    plugins: ["obstacle_layer", "inflation_layer"]

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      cost_scaling_factor: 12.0  # <-- RELAXED: Increased from 10.0 to 12.0. Higher = steeper drop-off, making the high-cost halo thinner.
      inflation_radius: 0.45     # <-- RELAXED: Dropped from 0.45 to 0.30. Shrinks the total footprint so gray space opens up in tight arenas.

    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"     
      enabled: True
      observation_sources: scan
      scan:
        topic: /our_bot/scan
        sensor_frame: our_bot/base_scan
        max_obstacle_height: 2.0
        clearing: True
        marking: True
        data_type: "LaserScan"
        raytrace_max_range: 3.0
        raytrace_min_range: 0.15
        obstacle_max_range: 2.5
        obstacle_min_range: 0.15
        inf_is_valid: true
    always_send_full_costmap: True