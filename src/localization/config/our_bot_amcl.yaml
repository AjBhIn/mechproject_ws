amcl:
  ros__parameters:
    use_sim_time: true
    
    # Frame Identifiers (Stripped for launch namespace injection)
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    map_topic: /map
    scan_topic: scan
    
    # Particle Filter Population Control (Optimized for High RTF)
    min_particles: 500          # Ensures enough density when converged
    max_particles: 2000         # Reduced from 8000 to save ~75% CPU load
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 2        # Resample every 2nd update to reduce overhead
    
    # Motion & Trigger Thresholds
    update_min_d: 0.15          # Updates pose after 15 cm movement
    update_min_a: 0.20          # Updates pose after ~11 deg rotation
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    
    # Odometry Motion Model Noise (TurtleBot Kinematics)
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    
    # Laser Sensor Model Parameters
    laser_model_type: "likelihood_field"
    max_beams: 30               # Reduced from 60 to halve ray-casting lookups
    laser_likelihood_max_dist: 2.0
    laser_min_range: -1.0
    laser_max_range: 100.0
    
    # Likelihood Field Model Weights
    z_hit: 0.8                  # Higher confidence in map hit matches
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.1                 # Reduced random noise weight
    sigma_hit: 0.2
    
    # TF & Initial Pose Setup
    tf_broadcast: true
    transform_tolerance: 1.0
    save_pose_rate: 0.5
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0